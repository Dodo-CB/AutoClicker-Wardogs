[package]
name = "wardogs-autoklicker"
version = "1.2.0"
edition = "2021"
description = "Wardogs Autoklicker (Rust)"

[dependencies]
# Fenster + WebView2 (gleiche Browser-Engine wie vorher bei pywebview)
tao = "0.30"
wry = "0.47"
# PNG-Dekodierung der Team-Logos
png = "0.17"
# Parallele Bildsuche (nutzt alle CPU-Kerne)
rayon = "1.10"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true